<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지게차 모바일 일보</title>
    <style>
        * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; }
        body { padding: 10px; background-color: #f8f9fa; color: #333; font-size: 14px; }
        h2 { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #111; }
        .config-box { background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #ced4da; margin-bottom: 12px; }
        .row-flex { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
        label { font-weight: bold; font-size: 13px; }
        select, input[type="text"], input[type="number"] { padding: 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; text-align: center; }
        .record-box { background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #ced4da; }
        .table-scroll { overflow-x: auto; margin-top: 8px; border: 1px solid #adb5bd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; min-width: 1250px; text-align: center; }
        th, td { border: 1px solid #adb5bd; height: 35px; vertical-align: middle; padding: 2px; font-size: 13px; font-weight: 500; }
        th { background-color: #495057 !important; color: #ffffff !important; font-weight: bold; }
        tr:nth-child(6n-5) td { background-color: #fff9db; border-bottom: 2px solid #ffec99; }
        tr:nth-child(6n-4) td { background-color: #e7f5ff; font-weight: bold; border-bottom: 2px solid #a5d8ff; }
        tr:nth-child(6n-3) td { background-color: #ffffff; }
        tr:nth-child(6n-2) td { background-color: #f1f3f5; font-weight: bold; }
        tr:nth-child(6n-1) td { background-color: #f1f3f5; font-weight: bold; }
        tr:nth-child(6n) td { background-color: #f1f3f5; font-weight: bold; border-bottom: 3px double #495057; }
        table input[type="number"] { width: 100%; height: 28px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; font-weight: bold; background-color: #fff; }
        table input[type="number"]:focus { border-color: #228be6; background-color: #fffaf0; outline: none; }
        .sunday { color: #e03131 !important; background-color: #fff5f5 !important; }
        .disabled-cell { background-color: #e9ecef !important; cursor: not-allowed; }
        input:disabled { background-color: #e9ecef; border-color: #dee2e6; color: #adb5bd; }
    </style>
</head>
<body>
    <div class="config-box">
        <h2>[ 필수 ] 초기 설정 및 마스터 메모</h2>
        <div class="row-flex">
            <label>연도:</label><select id="ddlYear" onchange="updateDaysByDate()"></select>
            <label style="margin-left:10px;">월:</label><select id="ddlMonth" onchange="updateDaysByDate()"></select>
            <label style="margin-left:10px;">이번달 일수:</label><span id="daysDisplay" style="font-weight:bold; color:blue;">31</span>
        </div>
        <div class="row-flex" style="margin-top:8px;">
            <label>누적시간(메모):</label><input type="text" id="editAccum1" style="width:120px;" placeholder="수동 메모 칸">
        </div>
    </div>
    <div class="record-box">
        <h2>지게차 가동 기록부 (1일차부터 아워미터 입력 시 즉시 연산)</h2>
        <div class="table-scroll"><table id="forkliftTable"></table></div>
    </div>

    <script>
        let Data = []; let ThisMonthDays = 31; const today = new Date();
        let SelectedYear = today.getFullYear(); let SelectedMonth = String(today.getMonth() + 1).padStart(2, '0');
        for (let i = 0; i <= 46; i++) { Data.push({ UseTime: 0, TotalUse: 0, DriveTime: 0, MaintTime: 0, IsMaint: false }); }
        window.onload = function() {
            const ySel = document.getElementById("ddlYear");
            for (let y = SelectedYear - 1; y <= SelectedYear + 1; y++) {
                let opt = document.createElement("option"); opt.value = y; opt.text = y;
                if (y === SelectedYear) opt.selected = true; ySel.appendChild(opt);
            }
            const mSel = document.getElementById("ddlMonth");
            for (let m = 1; m <= 12; m++) {
                let mStr = String(m).padStart(2, '0'); let opt = document.createElement("option"); opt.value = mStr; opt.text = mStr;
                if (mStr === SelectedMonth) opt.selected = true; mSel.appendChild(opt);
            }
            createHorizontalBlock(1, 15, "THIS_MONTH"); createHorizontalBlock(16, 31, "THIS_MONTH"); createHorizontalBlock(32, 46, "NEXT_MONTH");
            updateDaysByDate();
        };
        function updateDaysByDate() {
            SelectedYear = document.getElementById("ddlYear").value; SelectedMonth = document.getElementById("ddlMonth").value;
            let nY = Number(SelectedYear); let nM = Number(SelectedMonth) + 1; if (nM > 12) { nM = 1; nY += 1; }
            let tDate = new Date(nY, nM - 1, 1); tDate.setDate(tDate.getDate() - 1); ThisMonthDays = tDate.getDate();
            document.getElementById("daysDisplay").innerText = ThisMonthDays; refreshGrid();
        }
        function refreshGrid() {
            for (let idx = 17; idx <= 31; idx++) {
                let chk = document.getElementById("Check_" + idx); let use = document.getElementById("Use_" + idx);
                let total = document.getElementById("Total_" + idx); let drive = document.getElementById("Drive_" + idx); let maint = document.getElementById("Maint_" + idx);
                if (idx > ThisMonthDays) {
                    if (chk) { chk.checked = false; chk.disabled = true; }
                    if (use) { use.value = ""; use.disabled = true; use.classList.add("disabled-cell"); }
                    if (total) total.innerText = ""; if (drive) drive.innerText = ""; if (maint) maint.innerText = "";
                } else {
                    if (chk) chk.disabled = false; if (use) { use.disabled = false; use.classList.remove("disabled-cell"); }
                }
            }
            let nMNum = Number(SelectedMonth) + 1; let nMYear = SelectedYear; if (nMNum > 12) { nMNum = 1; nMYear = String(Number(SelectedYear) + 1); }
            let tNM = String(nMNum).padStart(2, '0');
            for (let idx = 1; idx <= 46; idx++) {
                if (idx > ThisMonthDays && idx <= 31) continue;
                let dayTextEl = document.getElementById("DayText_" + idx); if (!dayTextEl) continue;
                let wDay;
                if (idx <= 31) { let d = new Date(SelectedYear, Number(SelectedMonth) - 1, idx); wDay = d.getDay(); }
                else { let dispDay = idx - 31; let d = new Date(nMYear, Number(tNM) - 1, dispDay); wDay = d.getDay(); }
                if (wDay === 0) { dayTextEl.classList.add("sunday"); } else { dayTextEl.classList.remove("sunday"); }
            }
            calculateData();
        }
        function createHorizontalBlock(startDay, endDay, monthType) {
            const table = document.getElementById("forkliftTable");
            let rowChk = document.createElement("tr"); let rowDay = document.createElement("tr"); rowDay.classList.add("date-row");
            let rowUse = document.createElement("tr"); let rowTotal = document.createElement("tr");
            let rowDrive = document.createElement("tr"); let rowMaint = document.createElement("tr");
            rowChk.innerHTML = `<th style="min-width:90px;">정비체크</th>`; rowDay.innerHTML = `<th>날짜</th>`;
            rowUse.innerHTML = `<th>사용시간1일</th>`; rowTotal.innerHTML = `<th>합계</th>`;
            rowDrive.innerHTML = `<th>운행시간</th>`; rowMaint.innerHTML = `<th>정비시간</th>`;
            for (let idx = startDay; idx <= endDay; idx++) {
                let dispDay = (monthType === "THIS_MONTH") ? idx : (idx - 31);
                if (idx === 1) { rowChk.innerHTML += `<td>-</td>`; }
                else { rowChk.innerHTML += `<td><input type="checkbox" id="Check_${idx}" onchange="calculateData()"></td>`; }
                rowDay.innerHTML += `<td id="DayText_${idx}">${dispDay}</td>`;
                rowUse.innerHTML += `<td><input type="number" id="Use_${idx}" step="any" oninput="calculateData()"></td>`;
                if (idx === 1) {
                    rowTotal.innerHTML += `<td id="Total_1"></td>`;
                    rowDrive.innerHTML += `<td><input type="number" id="Drive_1" step="any" oninput="calculateData()"></td>`;
                    rowMaint.innerHTML += `<td><input type="number" id="Maint_1" step="any" oninput="calculateData()"></td>`;
                } else {
                    rowTotal.innerHTML += `<td id="Total_${idx}"></td>`; rowDrive.innerHTML += `<td id="Drive_${idx}"></td>`; rowMaint.innerHTML += `<td id="Maint_${idx}"></td>`;
                }
            }
            table.appendChild(rowChk); table.appendChild(rowDay); table.appendChild(rowUse); table.appendChild(rowTotal); table.appendChild(rowDrive); table.appendChild(rowMaint);
        }
        function calculateData() {
            let inUse1 = document.getElementById("Use_1") ? document.getElementById("Use_1").value : "";
            let inDrive1 = document.getElementById("Drive_1") ? document.getElementById("Drive_1").value : "";
            let inMaint1 = document.getElementById("Maint_1") ? document.getElementById("Maint_1").value : "";
            Data.UseTime = (inUse1 === "" || isNaN(inUse1)) ? 0 : Number(inUse1); Data.TotalUse = Data.UseTime;
            Data.DriveTime = (inDrive1 === "" || isNaN(inDrive1)) ? 0 : Number(inDrive1); Data.MaintTime = (inMaint1 === "" || isNaN(inMaint1)) ? 0 : Number(inMaint1);
            let total1El = document.getElementById("Total_1"); if (total1El) total1El.innerText = (inUse1 === "") ? "" : Data.TotalUse;
            if (inUse1 === "" || inDrive1 === "" || inMaint1 === "") {
                for (let dayIdx = 2; dayIdx <= 46; dayIdx++) {
                    if (dayIdx > ThisMonthDays && dayIdx <= 31) continue;
                    let t = document.getElementById("Total_" + dayIdx); if (t) t.innerText = "";
                    let d = document.getElementById("Drive_" + dayIdx); if (d) d.innerText = "";
                    let m = document.getElementById("Maint_" + dayIdx); if (m) m.innerText = "";
                }
                return;
            }
            for (let i = 2; i <= 46; i++) {
                if (i > ThisMonthDays && i <= 31) continue;
                let cellEl = document.getElementById("Use_" + i); let cellTxt = cellEl ? cellEl.value : "";
                Data[i].UseTime = (cellTxt === "" || isNaN(cellTxt)) ? 0 : Number(cellTxt);
                let chkEl = document.getElementById("Check_" + i); Data[i].IsMaint = chkEl ? chkEl.checked : false;
            }
            for (let i = 2; i <= 46; i++) {
                if (i > ThisMonthDays && i <= 31) continue;
                let prev = (i === 32) ? Data[ThisMonthDays] : Data[i - 1]; let curr = Data[i];
                curr.TotalUse = (i === 32) ? curr.UseTime : (prev.TotalUse + curr.UseTime);
                curr.DriveTime = prev.DriveTime + curr.UseTime;
                curr.MaintTime = curr.IsMaint ? curr.UseTime : (prev.MaintTime + curr.UseTime);
                let cellTotal = document.getElementById("Total_" + i); if (cellTotal) cellTotal.innerText = curr.TotalUse;
                let cellDrive = document.getElementById("Drive_" + i); if (cellDrive) cellDrive.innerText = curr.DriveTime;
                let cellMaint = document.getElementById("Maint_" + i); if (cellMaint) cellMaint.innerText = curr.MaintTime;
            }
        }
    </script>
</body>
</html>
